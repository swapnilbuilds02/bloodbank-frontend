<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Unit 3 Core Tests: format.js</title>
  <style>
    body { font-family: system-ui; padding: 24px; }
    .pass { color: green; font-weight: bold; }
    .fail { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Format.js Unit Verification</h1>
  <ul id="results"></ul>

  <script type="module">
    import { formatDate, parseDateParts, formatQuantityMl, pluralize, getInitials, cleanPhoneNumber } from '../js/core/format.js';

    const results = document.getElementById('results');
    function assert(name, condition) {
      const li = document.createElement('li');
      li.className = condition ? 'pass' : 'fail';
      li.textContent = `${name}: ${condition ? 'PASS' : 'FAIL'}`;
      results.appendChild(li);
    }

    assert('parseDateParts valid', parseDateParts('2026-11-15')?.year === 2026);
    assert('formatDate standard', formatDate('2026-11-15') === '15 Nov 2026');
    assert('formatQuantityMl', formatQuantityMl(450) === '450 ml');
    assert('pluralize singular', pluralize(1, 'unit') === '1 unit');
    assert('pluralize plural', pluralize(5, 'unit') === '5 units');
    assert('getInitials two words', getInitials('John Doe') === 'JD');
    assert('cleanPhoneNumber digits', cleanPhoneNumber('+123-456 789') === '+123456789');
  </script>
</body>
</html>
